[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beta-regression"
version = "0.1.0"
description = "Endoscopic polyp size estimation with DLEF"
readme = "README.md"
requires-python = ">=3.10"
# The core is installed separately (not from PyPI):
#   pip install -e /path/to/DLEF
# or from a wheel/git URL. Then: pip install -e .
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "torch>=2.0",
  "torchvision>=0.15",
  "PyYAML>=6",
  "tensorboard>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["core*"]
